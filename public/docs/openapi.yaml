components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Strapi API Token. Generate one in Settings → API Tokens."
  parameters:
    paginationPage:
      name: "pagination[page]"
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: "Page number"
    paginationPageSize:
      name: "pagination[pageSize]"
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: "Number of results per page"
    populate:
      name: populate
      in: query
      schema:
        type: string
      description: "Relations to populate, e.g. * or article_category,author"
    documentId:
      name: id
      in: path
      required: true
      schema:
        oneOf:
          - type: integer
          - type: string
      description: "Document ID or slug"
