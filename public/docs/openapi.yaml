        - $ref: "#/components/parameters/populate"
        - name: "filters[type][$eq]"
          in: query
          schema:
            type: string
            enum: [info, warning, success, error]
          description: "Filter by type"
        - name: "filters[active][$eq]"
          in: query
          schema:
            type: boolean
          description: "Filter by active"
      responses:
        "200":
          description: OK
