paths:
  /search:
    get:
      tags: [Search]
      summary: "Full-text search powered by Algolia"
      operationId: search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: "Search query"
        - name: type
          in: query
          schema:
            type: string
          description: "Content type filter, e.g. article,course"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: "Page number (0-indexed)"
        - name: hitsPerPage
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: "Number of results per page"
      responses:
        "200":
          description: OK
        "400":
          description: "Missing required query parameter q"
        "503":
          description: "Search service not configured"
  /search/popular:
    get:
      tags: [Popular Searches]
      summary: "Get top 5 popular search keywords"
      operationId: popularSearches
      responses:
