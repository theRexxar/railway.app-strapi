openapi: "3.0.3"
info:
  title: JARI PMI CMS API
  description: |
    Strapi v5 CMS API for JARI PMI — a landing page providing information for Indonesian migrant workers (PMI).

    ## Authentication
    `/api/global` and `/api/homepage` are publicly accessible without authentication (auth: false).
    All other endpoints require a Strapi API token. Create one in **Settings → API Tokens** in the admin panel.
    Paste your token in the Swagger UI "API Token" bar above.

    ## Pagination
    List endpoints support `pagination[page]` and `pagination[pageSize]` query parameters.
    Default page size is 25. Response includes `pagination` object with `page`, `pageSize`, `pageCount`, `total`.

    ## Filtering
    Use `filters` query parameter. Example: `?filters[is_featured][$eq]=true`

    ## Population
    Use `populate` query parameter to include relations. Example: `?populate=article_category,author`
  version: "1.0.0"
  contact:
    name: JARI PMI Team
servers:
  - url: "https://jari-pmi.example.com/api"
    description: Production
  - url: "http://localhost:1337/api"
    description: Development
security:
  - bearerAuth: []
tags:
