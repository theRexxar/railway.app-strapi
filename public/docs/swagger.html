<!DOCTYPE html>
<html>
<head>
  <title>JARI PMI CMS API Documentation</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" >
  <style>
    body { margin: 0; padding: 0; }
    #token-bar { background: #1b1b1b; padding: 10px 20px; display: flex; align-items: center; gap: 10px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #token-bar label { color: #a0a0a0; font-size: 13px; white-space: nowrap; }
    #token-bar input { flex: 1; max-width: 500px; padding: 6px 10px; border: 1px solid #444; border-radius: 4px; background: #2a2a2a; color: #e0e0e0; font-size: 13px; font-family: monospace; }
    #token-bar input::placeholder { color: #666; }
    #token-bar button { padding: 6px 16px; border: 1px solid #4fc3f7; border-radius: 4px; background: transparent; color: #4fc3f7; cursor: pointer; font-size: 13px; }
    #token-bar button:hover { background: #4fc3f7; color: #1b1b1b; }
    #token-bar .status { color: #4caf50; font-size: 12px; margin-left: 8px; }
    #docs-nav { background: #1b1b1b; padding: 6px 20px; display: flex; align-items: center; gap: 16px; border-top: 1px solid #333; }
    #docs-nav a { color: #a0a0a0; text-decoration: none; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; }
    #docs-nav a:hover { color: #fff; }
    #docs-nav a.active { color: #4fc3f7; font-weight: 600; }
  </style>
</head>
<body>
  <div id="token-bar">
    <label>API Token:</label>
    <input type="password" id="api-token" placeholder="Paste your Strapi API token here" />
    <button onclick="applyToken()">Apply</button>
    <button onclick="clearToken()">Clear</button>
    <span class="status" id="token-status"></span>
  </div>
  <div id="docs-nav">
    <a href="/docs/swagger.html" class="active">Swagger UI</a>
    <a href="/docs/">Redoc</a>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    var ui;

    function applyToken() {
      var token = document.getElementById('api-token').value.trim();
      if (!token) return;
      ui.preauthorizeApiKey('bearerAuth', token);
      localStorage.setItem('jari_pmi_api_token', token);
      document.getElementById('token-status').textContent = 'Token applied';
      document.getElementById('api-token').type = 'password';
    }

    function clearToken() {
      document.getElementById('api-token').value = '';
      localStorage.removeItem('jari_pmi_api_token');
      document.getElementById('token-status').textContent = 'Token cleared';
      ui.preauthorizeApiKey('bearerAuth', '');
    }

    ui = SwaggerUIBundle({
      url: '/docs/openapi.yaml',
      dom_id: '#swagger-ui',
      presets: [
        SwaggerUIBundle.presets.apis,
        SwaggerUIBundle.SwaggerUIStandalonePreset
      ],
      layout: 'BaseLayout',
      tryItOutEnabled: true,
      persistAuthorization: true,
      requestInterceptor: function(request) {
        var token = localStorage.getItem('jari_pmi_api_token');
        if (token) {
          request.headers['Authorization'] = 'Bearer ' + token;
        }
        return request;
      }
    });

    // Restore saved token on load
    var savedToken = localStorage.getItem('jari_pmi_api_token');
    if (savedToken) {
      document.getElementById('api-token').value = savedToken;
      // Pre-authorize after Swagger UI is ready
      setTimeout(function() {
        ui.preauthorizeApiKey('bearerAuth', savedToken);
        document.getElementById('token-status').textContent = 'Token restored';
      }, 1000);
    }
  </script>
</body>
</html>
